<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Estacionamento</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body>
<main class="auth-page">
    <section class="auth-layout">
        <aside class="auth-aside">
            <a class="brand" th:href="@{/}" href="/">
                <span class="brand-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h8a5 5 0 0 1 0 10H6z"/><path d="M6 13v8"/></svg>
                </span>
                ParkFlow
            </a>

            <div class="auth-message">
                <h1>Crie seu acesso em poucos passos.</h1>
                <p>Preencha seus dados para começar a utilizar o sistema de controle do estacionamento.</p>
            </div>

            <span class="auth-badge">Cadastro rápido e direto</span>
        </aside>

        <div class="auth-card">
            <div class="form-wrap">
                <span class="eyebrow">Nova conta</span>
                <h2>Cadastre-se</h2>
                <p>Informe seus dados para criar uma conta.</p>

                <form class="form" method="post" th:action="@{/efetuar-cadastro}" action="/efetuar-cadastro">
                    <div class="form-grid">
                        <div class="field full">
                            <label for="nome">Nome completo</label>
                            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" autocomplete="name" required>
                        </div>

                        <div class="field">
                            <label for="cpf">CPF</label>
                            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" inputmode="numeric" required>
                        </div>

                        <div class="field">
                            <label for="telefone">Telefone</label>
                            <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999" autocomplete="tel" required>
                        </div>

                        <div class="field full">
                            <label for="email">E-mail</label>
                            <input type="email" id="email" name="email" placeholder="nome@exemplo.com" autocomplete="email" required>
                        </div>

                        <div class="field">
                            <label for="senha">Senha</label>
                            <input type="password" id="senha" name="senha" placeholder="Crie uma senha" autocomplete="new-password" required>
                        </div>

                        <div class="field">
                            <label for="data_nascimento">Data de nascimento</label>
                            <input type="date" id="data_nascimento" name="data_nascimento" required>
                        </div>
                    </div>

                    <button class="btn btn-primary" type="submit">Criar conta</button>
                </form>

                <p class="form-footer">Já possui uma conta? <a th:href="@{/}" href="/">Voltar ao login</a></p>
            </div>
        </div>
    </section>
</main>
</body>
</html>
